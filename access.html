<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Dynamics Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0b1220;
      --muted: #6b7a90;
      --line: #d5dde8;
      --accent: #1484d4;
      --accent-2: #0b3d8c;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      color: var(--ink);
      background: #071018;
      font-family: "DM Sans", sans-serif;
    }
    body::before {
      position: fixed;
      inset: 0;
      content: "";
      background:
        radial-gradient(circle at 18% 20%, rgba(20,132,212,.28), transparent 34%),
        radial-gradient(circle at 82% 78%, rgba(11,61,140,.35), transparent 32%),
        linear-gradient(160deg, #071422 0%, #0a1c33 48%, #061018 100%);
    }
    .shell {
      position: relative;
      z-index: 1;
      display: grid;
      width: min(920px, calc(100% - 32px));
      min-height: 560px;
      grid-template-columns: 1.05fr .95fr;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 40px 100px rgba(0,0,0,.45);
    }
    .story {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 36px 32px;
      color: #e8f3ff;
      background: linear-gradient(155deg, #0b3d8c 0%, #0a64b5 48%, #1484d4 100%);
    }
    .brand {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand img {
      width: min(360px, 88%);
      height: auto;
      display: block;
    }
    .story-copy { max-width: 360px; }
    .story-copy p {
      margin: 0;
      color: rgba(255,255,255,.78);
      font-size: 13px;
      line-height: 1.65;
    }
    .form-panel {
      display: flex;
      align-items: center;
      padding: 48px 44px;
      background: #f4f7fb;
    }
    form { width: 100%; }
    h2 {
      margin: 0 0 8px;
      font: 700 28px/1.1 "DM Sans", sans-serif;
      letter-spacing: -.02em;
    }
    .form-intro { margin: 0 0 28px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 4px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font: 500 16px/1 "DM Sans", sans-serif;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(20,132,212,.18); }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px 16px;
      border: 0;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      color: #fff;
      cursor: pointer;
      font: 600 12px "DM Sans", sans-serif;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    button:hover { filter: brightness(1.06); }
    button:disabled { cursor: wait; opacity: .65; }
    .error { min-height: 20px; margin: 11px 0 0; color: #b42318; font-size: 11px; }
    @media (max-width: 700px) {
      body { overflow: auto; }
      .shell { margin: 16px 0; grid-template-columns: 1fr; min-height: calc(100vh - 32px); }
      .story { min-height: 220px; padding: 24px; }
      .form-panel { padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="story">
      <div class="brand">
        <img src="dslogo.png" alt="Dynamics Studio">
      </div>
      <div class="story-copy">
        <p>Entry system configuration for sales and production.</p>
      </div>
    </section>
    <section class="form-panel">
      <form id="access-form">
        <h2>Welcome</h2>
        <p class="form-intro">Use your access code to open the workspace.</p>
        <label for="access-code">Access code</label>
        <input id="access-code" name="code" type="password" inputmode="numeric" autocomplete="one-time-code" required autofocus aria-describedby="error-message">
        <button type="submit">Sign in</button>
        <p class="error" id="error-message" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script>
    const form = document.querySelector('#access-form');
    const input = document.querySelector('#access-code');
    const button = form.querySelector('button');
    const error = document.querySelector('#error-message');
    const LOCK_KEY = 'ds_lock';
    const FAIL_KEY = 'ds_fails';
    const MAX_FAILS = 5;
    const LOCK_MS = 60000;
    const lockedUntil = () => Number(sessionStorage.getItem(LOCK_KEY) || 0);
    const isLocked = () => Date.now() < lockedUntil();
    const setLockedUi = () => {
      if (!isLocked()) return false;
      const sec = Math.ceil((lockedUntil() - Date.now()) / 1000);
      button.disabled = true;
      error.textContent = 'Too many attempts. Try again in ' + sec + 's.';
      return true;
    };
    setInterval(setLockedUi, 1000);
    setLockedUi();
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (setLockedUi()) return;
      error.textContent = '';
      button.disabled = true;
      button.textContent = 'Signing in…';
      try {
        const response = await fetch('/api/access', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ code: String(input.value || '').trim() })
        });
        if (!response.ok) {
          const fails = Number(sessionStorage.getItem(FAIL_KEY) || 0) + 1;
          sessionStorage.setItem(FAIL_KEY, String(fails));
          if (fails >= MAX_FAILS) {
            sessionStorage.setItem(LOCK_KEY, String(Date.now() + LOCK_MS));
            sessionStorage.setItem(FAIL_KEY, '0');
            setLockedUi();
            return;
          }
          error.textContent = response.status === 401
            ? 'That access code is not recognized.'
            : response.status === 503
              ? 'Access is not configured yet.'
              : 'Access could not be verified. Please try again.';
          input.select();
          return;
        }
        sessionStorage.removeItem(FAIL_KEY);
        sessionStorage.removeItem(LOCK_KEY);
        document.cookie = 'ds_studio=1; path=/; max-age=604800; SameSite=Lax';
        window.location.replace('/');
      } catch {
        error.textContent = 'Unable to connect. Check your connection and try again.';
      } finally {
        if (!isLocked()) {
          button.disabled = false;
          button.textContent = 'Sign in';
        }
      }
    });
  </script>
</body>
</html>
