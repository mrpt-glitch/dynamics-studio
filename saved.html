<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved configurations — Dynamics Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #0b1220; --muted: #6b7a90; --line: #d5dde8; --paper: #f4f7fb; --panel: #ffffff; --accent: #1484d4; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); font-family: "DM Sans", sans-serif; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; background: var(--panel); border-bottom: 1px solid var(--line); }
        header a { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600; }
        h1 { margin: 0; font-size: 16px; font-weight: 700; }
        main { max-width: 900px; margin: 0 auto; padding: 28px 32px; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px; margin-bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
        .code { font: 600 13px monospace; }
        .spec { color: var(--muted); font-size: 12px; margin-top: 4px; max-width: 560px; }
        .price { font-weight: 700; white-space: nowrap; }
        .time { color: var(--muted); font-size: 11px; white-space: nowrap; }
        .empty, .error { color: var(--muted); text-align: center; padding: 60px 0; font-size: 13px; }
        .error { color: #b42318; }
    </style>
</head>
<body>
    <header>
        <h1>Saved configurations</h1>
        <a href="/">← Back to studio</a>
    </header>
    <main id="list"><p class="empty">Loading…</p></main>
    <script>
        function timeAgo(iso) {
            const seconds = Math.max(1, Math.round((Date.now() - new Date(iso)) / 1000));
            if (seconds < 60) return seconds + 's ago';
            const m = Math.round(seconds / 60); if (m < 60) return m + 'm ago';
            const h = Math.round(m / 60); if (h < 24) return h + 'h ago';
            return Math.round(h / 24) + 'd ago';
        }
        async function load() {
            const list = document.getElementById('list');
            try {
                const response = await fetch('/api/configurations?limit=50');
                if (response.status === 401) { window.location.replace('/access.html'); return; }
                if (!response.ok) throw new Error('Server responded ' + response.status);
                const rows = await response.json();
                if (!rows.length) { list.innerHTML = '<p class="empty">No configurations saved yet.</p>'; return; }
                list.innerHTML = rows.map(row => `
                    <div class="row">
                        <div>
                            <div class="code">${row.build_code}</div>
                            <div class="spec">${row.spec}</div>
                        </div>
                        <div style="text-align:right;">
                            <div class="price">$${Number(row.price).toLocaleString('en-US')}</div>
                            <div class="time">${timeAgo(row.created_at)}</div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('[Saved] could not load:', err);
                list.innerHTML = '<p class="error">Could not load saved configurations.</p>';
            }
        }
        load();
    </script>
</body>
</html>
